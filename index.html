<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Alois Mayr Test Informatik</title>
</head>

<body style="background-color: lightblue;">

  <h1>Alois Mayr – 5r</h1>

  <h2>Persönliche Daten</h2>
  <p>Geburtsdatum: 25.07.2011</p>
  <p>Lieblingsfarbe:Hellblau</p>

  <h2>Meine Lieblingsfächer</h2>
  <ol>
    <li>Sport</li>
    <li>Physik</li>
    <li>Biologie</li>
  </ol>

  <h2>Meine Hobbys</h2>
  <ul id="liste-hobbys"></ul>

  <h2>Freies Bild</h2>
  <figure>
    <img src="img/bild1.jpg" alt="Hauskatze auf einer Wiese" width="400" title="Freies Bild" />
    <figcaption>
      <a href="https://commons.wikimedia.org/wiki/User:Pdanese">Paul Danese</a>,
      <a href="https://commons.wikimedia.org/wiki/File:20231125_housecat_south_meadows_PD100306.jpg">Outdoor House-cat, Rivermead Pointe North, East Hartford, CT USA</a>,
      <a href="https://creativecommons.org/licenses/by-sa/4.0">CC BY-SA 4.0</a>
    </figcaption>
  </figure>

  <script>
    const hobbys = ["Bouldern", "Fußballspielen","Klavierspielen",Alois Mayr"];  // deine eigenen Hobbys und Name eintragen
    const liste = document.getElementById("liste-hobbys");
    hobbys.forEach(h => {
      let li = document.createElement("li");
      li.textContent = h;
      liste.appendChild(li);
    });
  </script>

</body>
</html>
