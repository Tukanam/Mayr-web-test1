<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Alois Mayr Test Informatik</title>
</head>

<body style="background-color: green;">

  <h1>Alois Mayr – 5r</h1>

  <h2>Persönliche Daten</h2>
  <p>Geburtsdatum: 25.07.2011</p>
  <p>Lieblingsfarbe:Grün</p>

  <h2>Meine Lieblingsfächer</h2>
  <ol>
    <li>Sport</li>
    <li>Physik</li>
    <li>Biologie</li>
  </ol>

  <h2>Meine Hobbys</h2>
  <ul id="liste-hobbys"></ul>

  <h2>Freies Bild</h2>
  <figure>
    <img src="bild.jpg" alt="BILDBESCHREIBUNG" />
  </figure>

  <script>
    const hobbys = ["Bouldern", "Fußballspielen"];  // deine eigenen Hobbys und Name eintragen
    const liste = document.getElementById("liste-hobbys");
    hobbys.forEach(h => {
      let li = document.createElement("li");
      li.textContent = h;
      liste.appendChild(li);
    });
  </script>

</body>
</html>
